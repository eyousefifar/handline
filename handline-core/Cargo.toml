[package]
name = "handline-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference protocol for Handline, a phone-to-phone bridge"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"

[dev-dependencies]
proptest = "1"
